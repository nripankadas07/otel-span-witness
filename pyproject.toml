[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otel-span-witness"
version = "0.1.0"
description = "Offline captured-input analysis with explicit evidence and bounded contracts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.scripts]
otel-span-witness = "otel_span_witness:main"

[tool.setuptools]
py-modules = ["otel_span_witness"]
